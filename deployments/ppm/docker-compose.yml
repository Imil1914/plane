# PPM production deployment (release candidate).
#
# Use through ppm-deploy.sh: it passes the Compose project name (-p), the env file (--env-file ppm.env) and, for a
# local rehearsal with PPM_TLS=internal, docker-compose.internal-tls.yml. Images come from ppm-build.sh.
# Only the proxy publishes ports; PostgreSQL, Valkey, RabbitMQ and MinIO stay on the internal network.
# Infrastructure images are pinned by multi-arch digest; PPM_DOCKERHUB_MIRROR switches the registry host
# (e.g. mirror.gcr.io) without changing the content.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  DEBUG: "0"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (ppm-env.sh init)}
  # The API accepts only the public host; `api` is the in-network name used by the live service.
  ALLOWED_HOSTS: ${PPM_DOMAIN:?PPM_DOMAIN is required},api
  # One https origin → secure session/CSRF cookies, CSRF trusted origin and CORS (plane/settings/common.py).
  CORS_ALLOWED_ORIGINS: ${PPM_PUBLIC_URL:?PPM_PUBLIC_URL is required}
  WEB_URL: ${PPM_PUBLIC_URL}
  GUNICORN_WORKERS: ${PPM_GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@plane-db:5432/plane
  REDIS_URL: redis://plane-redis:6379/
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@plane-mq:5672/plane
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "1"
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  AWS_S3_BUCKET_NAME: uploads
  # Server-side S3 calls use the public URL on purpose: Vault presigned downloads are signed without the request
  # (ppm_vault/storage.py), so the signing endpoint must be the host the browser can reach. Inside the network the
  # public name resolves to the proxy (network alias below), which forwards /uploads to MinIO.
  AWS_S3_ENDPOINT_URL: ${PPM_PUBLIC_URL}
  # Bounded S3 client (plane/settings/storage.py): an unreachable MinIO fails a request in seconds.
  AWS_S3_CONNECT_TIMEOUT: ${PPM_S3_CONNECT_TIMEOUT:-5}
  AWS_S3_READ_TIMEOUT: ${PPM_S3_READ_TIMEOUT:-10}
  AWS_S3_MAX_ATTEMPTS: ${PPM_S3_MAX_ATTEMPTS:-2}
  FILE_SIZE_LIMIT: ${PPM_FILE_SIZE_LIMIT:-5242880}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}
  API_KEY_RATE_LIMIT: 60/minute
  # Closed instance by default: nobody can self-register. Read only on the first start (stored in the database);
  # afterwards the instance administrator changes it in god-mode → Authentication.
  ENABLE_SIGNUP: ${PPM_ENABLE_SIGNUP:-0}
  # No telemetry egress: Plane pushes instance metrics to telemetry.plane.so when the instance flag is on (the
  # god-mode sign-up checkbox defaults to on). Pointing OTLP at a local discard port makes a missed checkbox harmless.
  OTLP_ENDPOINT: ${PPM_OTLP_ENDPOINT:-http://127.0.0.1:9}
  # RC flags (owner decisions 2026-09-26): AI answers, providers and agents off; keyword search stays on;
  # provider writes to Git off until the live check.
  PPM_BRAIN_ENABLED: "1"
  PPM_BRAIN_GRAPH_ENABLED: "1"
  PPM_BRAIN_ANSWERS_ENABLED: "0"
  PPM_BRAIN_EMBEDDING_PROVIDER: disabled
  PPM_BRAIN_COMPLETION_PROVIDER: disabled
  PPM_BRAIN_ALLOW_EXTERNAL_EMBEDDINGS: "0"
  PPM_BRAIN_ALLOW_EXTERNAL_COMPLETIONS: "0"
  PPM_AGENTS_ENABLED: "0"
  PPM_AGENTS_WRITE_ENABLED: "0"
  PPM_GIT_WRITE_ENABLED: ${PPM_GIT_WRITE_ENABLED:-0}
  PPM_CANVAS_AUTOMERGE: ${PPM_CANVAS_AUTOMERGE:-1}
  # UX2.1: other members' changes of tasks, sprints and directions arrive live over /ws/; 0 switches the channel off
  # (the socket answers 4404 and the web client keeps its 30-second refresh). Absent in older env files = on.
  PPM_REALTIME_EVENTS_ENABLED: ${PPM_REALTIME_EVENTS_ENABLED:-1}
  # Optional GitHub App (Git integration). Empty values keep Git unconfigured.
  PPM_GITHUB_APP_ID: ${PPM_GITHUB_APP_ID:-}
  PPM_GITHUB_APP_SLUG: ${PPM_GITHUB_APP_SLUG:-}
  PPM_GITHUB_APP_CLIENT_ID: ${PPM_GITHUB_APP_CLIENT_ID:-}
  PPM_GITHUB_CALLBACK_URL: ${PPM_GITHUB_CALLBACK_URL:-}
  PPM_GITHUB_APP_CLIENT_SECRET: ${PPM_GITHUB_APP_CLIENT_SECRET:-}
  PPM_GITHUB_APP_PRIVATE_KEY: ${PPM_GITHUB_APP_PRIVATE_KEY:-}
  PPM_GITHUB_WEBHOOK_SECRET: ${PPM_GITHUB_WEBHOOK_SECRET:-}

x-api-image: &api-image ${PPM_IMAGE_REPO:-ppm}/api:${PPM_RELEASE:?PPM_RELEASE is required}

services:
  plane-db:
    image: ${PPM_DOCKERHUB_MIRROR:-docker.io}/library/postgres:15.7-alpine@sha256:468d34fefd6338031787c7b8e94078975b3aaf4d66c7ead25c39cd3ba46a15c6
    restart: unless-stopped
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_USER: plane
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  plane-redis:
    image: ${PPM_DOCKERHUB_MIRROR:-docker.io}/valkey/valkey:7.2.11-alpine@sha256:10328d00120dc14fbc87b2ed61b7677ddbb0d011e705361b4788329a0ec69a93
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  plane-mq:
    image: ${PPM_DOCKERHUB_MIRROR:-docker.io}/library/rabbitmq:3.13.6-management-alpine@sha256:611107e29cce05c2acd968325d5dcbde7e2fee404970f1ead75fdb22be2821b3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
    logging: *logging

  plane-minio:
    image: ${PPM_MINIO_IMAGE:?PPM_MINIO_IMAGE is required (built by ppm-build.sh)}
    restart: unless-stopped
    command: ["server", "/export", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/export
    logging: *logging

  # Creates the private `uploads` bucket directly on MinIO (no dependency on the proxy/TLS being ready).
  minio-init:
    image: ${PPM_MINIO_IMAGE}
    restart: "no"
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "ppm/uploads"]
    environment:
      MC_HOST_ppm: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@plane-minio:9000
      MC_CONFIG_DIR: /tmp/mc
    depends_on:
      plane-minio:
        condition: service_healthy
    logging: *logging

  proxy:
    image: ${PPM_IMAGE_REPO:-ppm}/proxy:${PPM_RELEASE}
    restart: unless-stopped
    environment:
      PPM_DOMAIN: ${PPM_DOMAIN}
      PPM_TLS: ${PPM_TLS:?PPM_TLS is required (ACME e-mail or internal)}
      PPM_HTTP_PORT: ${PPM_HTTP_PORT:-80}
      PPM_HTTPS_PORT: ${PPM_HTTPS_PORT:-443}
      PPM_HSTS_MAX_AGE: ${PPM_HSTS_MAX_AGE:-31536000}
      PPM_ACME_CA: ${PPM_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      PPM_PROXY_MAX_BODY_SIZE: ${PPM_PROXY_MAX_BODY_SIZE:-16MB}
    ports:
      - "${PPM_BIND_ADDRESS:-127.0.0.1}:${PPM_HTTP_PORT:-80}:${PPM_HTTP_PORT:-80}"
      - "${PPM_BIND_ADDRESS:-127.0.0.1}:${PPM_HTTPS_PORT:-443}:${PPM_HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - ${PPM_DOMAIN}
    logging: *logging

  migrator:
    image: *api-image
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: *app-env
    volumes:
      - logs_migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    logging: *logging

  api:
    image: *api-image
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: *app-env
    volumes:
      - logs_api:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/', headers={'Host': 'api'}), timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *logging

  worker:
    image: *api-image
    restart: unless-stopped
    # Log level WARNING: at INFO Celery's JSON log lines carry every task's args/kwargs and return value — e.g. the
    # password-reset and magic-link tokens of e-mail tasks, and query strings/bodies of X-Api-Key requests
    # (process_logs). Task code keeps logging through the `plane.worker` logger; failures stay visible.
    command:
      - bash
      - -c
      - "python manage.py wait_for_db && python manage.py wait_for_migrations && exec celery -A plane worker -l warning --concurrency=${PPM_WORKER_CONCURRENCY:-2}"
    environment:
      <<: *app-env
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    # The worker answers a broker round-trip ping (proves broker + worker process are alive).
    healthcheck:
      test: ["CMD-SHELL", "celery -A plane inspect ping -d \"celery@$$HOSTNAME\" --timeout 10 >/dev/null 2>&1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    logging: *logging

  beat-worker:
    image: *api-image
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: *app-env
    volumes:
      - logs_beat:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    # Beat has no broker reply to ping: the scheduler process must be alive ([b] keeps the probe's own shell,
    # whose command line contains the pattern text, from matching itself).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery -A plane [b]eat' >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  live:
    image: ${PPM_IMAGE_REPO:-ppm}/live:${PPM_RELEASE}
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:8000
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_URL: redis://plane-redis:6379/
      CORS_ALLOWED_ORIGINS: ${PPM_PUBLIC_URL}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/live/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  web:
    image: ${PPM_IMAGE_REPO:-ppm}/web:${PPM_RELEASE}
    restart: unless-stopped
    logging: *logging

  admin:
    image: ${PPM_IMAGE_REPO:-ppm}/admin:${PPM_RELEASE}
    restart: unless-stopped
    logging: *logging

  space:
    image: ${PPM_IMAGE_REPO:-ppm}/space:${PPM_RELEASE}
    restart: unless-stopped
    logging: *logging

  # ---- one-off operator tools (profile "tools"; started only by ppm-deploy.sh / ppm-backup.sh / ppm-restore.sh)
  # Both run as the invoking host user (PPM_HOST_UID/GID, set by the scripts), so files they write into bind
  # mounts (backups, smoke state) belong to the operator on Linux, not to root.

  # Post-deploy smoke and the first-administrator claim: run inside the network with the API image.
  smoke:
    profiles: ["tools"]
    image: *api-image
    user: "${PPM_HOST_UID:-0}:${PPM_HOST_GID:-0}"
    entrypoint: ["python", "/smoke/ppm_smoke.py"]
    environment:
      HOME: /tmp
      PPM_PUBLIC_URL: ${PPM_PUBLIC_URL}
      PPM_SMOKE_STATE: /state/smoke-state.json
    volumes:
      - ./smoke:/smoke:ro
      - ${PPM_SMOKE_DIR:-./.runtime/smoke}:/state
    logging: *logging

  # Backup/restore tools (mc + GnuPG); credentials come from the environment, never from the command line.
  mc:
    profiles: ["tools"]
    image: ${PPM_IMAGE_REPO:-ppm}/tools:${PPM_RELEASE}
    user: "${PPM_HOST_UID:-0}:${PPM_HOST_GID:-0}"
    entrypoint: ["mc"]
    environment:
      HOME: /tmp
      MC_HOST_ppm: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@plane-minio:9000
      MC_CONFIG_DIR: /tmp/mc
      GNUPGHOME: /tmp/gnupg
    logging: *logging

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  minio_data:
  caddy_data:
  caddy_config:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
