worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  # Access log without query strings and referrers: they carry one-time credentials (password-reset and invitation
  # tokens, OAuth code/state) and e-mail addresses. $uri is not used because after try_files it is the SPA fallback
  # (index.html) for every page; the original path is taken from $request_uri and cut at "?".
  map $request_uri $ppm_log_path {
    "~^(?<ppm_path>[^?]*)" $ppm_path;
    default "-";
  }
  log_format ppm_no_query '$remote_addr - [$time_local] "$request_method $ppm_log_path $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout ppm_no_query;
  # Request-scoped error entries print the raw request line and referrer (with the query string); a static file
  # server has none worth that risk. Start-up and worker failures (crit/alert/emerg) stay visible.
  error_log /dev/stderr crit;
  log_not_found off;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /god-mode/index.html;
    }
  }
}